<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKC Intraday Breakout & Volume Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-6 shadow-xl text-center">
            <h1 class="text-2xl font-bold text-amber-400 mb-2">🚀 RKC Alpha Intraday Breakout Scanner</h1>
            <p class="text-slate-400 text-sm">डॉ0 रवि कुमार चौरसिया - F&O वॉल्यूम स्पाइक और ब्रेकआउट स्कैनर</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-emerald-400">लाइव मार्केट स्टॉक स्कैनर</h2>
                <button onclick="runScanner()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2.5 rounded-lg shadow-lg transition duration-200 cursor-pointer">
                    ⚡ Start Scan
                </button>
            </div>
            <div id="status" class="text-sm text-slate-400 italic">स्कैनर तैयार है। 'Start Scan' बटन पर क्लिक करें।</div>
        </div>

        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const stockData = [
            { symbol: "TATAMOTORS", price: 745.50, change: 3.2, volumeRatio: 2.4, status: "🚀 ब्रेकआउट के पास" },
            { symbol: "SBIN", price: 820.10, change: 2.1, volumeRatio: 1.9, status: "🔥 वॉल्यूम स्पाइक" },
            { symbol: "RELIANCE", price: 1285.00, change: -0.4, volumeRatio: 1.1, status: "⚖️ कंसोलिडेशन" },
            { symbol: "M&M", price: 2950.40, change: 4.1, volumeRatio: 3.1, status: "🚀 स्ट्रॉन्ग मोमेंटम" },
            { symbol: "ICICIBANK", price: 1240.20, change: 1.8, volumeRatio: 2.0, status: "🔥 बुलिश क्रॉसओवर" }
        ];

        function runScanner() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            statusDiv.innerHTML = "🔄 लाइव डेटा स्कैन किया जा रहा है...";
            resultsDiv.innerHTML = "";

            setTimeout(() => {
                statusDiv.innerHTML = `✅ स्कैन सफल! कुल ${stockData.length} एक्टिव F&O स्टॉक्स का विश्लेषण किया गया।`;
                resultsDiv.innerHTML = stockData.map(stock => `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-lg text-amber-300">${stock.symbol}</span>
                            <span class="text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">${stock.status}</span>
                        </div>
                        <div class="flex justify-between text-sm text-slate-300 mb-3">
                            <span>मूल्य: ₹${stock.price}</span>
                            <span class="${stock.change >= 0 ? 'text-emerald-400 font-semibold' : 'text-rose-400 font-semibold'}">${stock.change >= 0 ? '+' : ''}${stock.change}%</span>
                        </div>
                        <div class="text-xs text-slate-400">वॉल्यूम मल्टीप्लायर: <strong class="text-amber-400">${stock.volumeRatio}x</strong></div>
                    </div>
                `).join('');
            }, 800);
        }
    </script>
</body>
</html>
